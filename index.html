<!doctype html>
<html lang="ja"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080d18"><title>OTHELLO</title><link rel="stylesheet" href="style.css">
</head><body><main class="app">
<header><p class="eyebrow">ARCADE</p><h1><span>OTHELLO</span></h1><p class="sub">ふたりで遊べるオセロ</p></header>
<section class="scores">
<div class="player" id="blackPanel"><span>BLACK</span><i class="disc black"></i><b id="blackScore">2</b></div><div class="vs">VS</div>
<div class="player" id="whitePanel"><span>WHITE</span><i class="disc white"></i><b id="whiteScore">2</b></div>
</section>
<div class="turn" aria-live="polite"><i id="turnDot" class="dot black-dot"></i><span id="turnText">BLACK の番です</span></div>
<section class="board-frame"><div class="board" id="board" role="grid" aria-label="オセロ盤"></div></section>
<p class="message" id="message" aria-live="polite">光っているマスに置けます</p>
<div class="actions"><button id="hintButton" class="secondary">置ける場所を隠す</button><button id="resetButton" class="primary">最初から</button></div>
<section class="rules"><h2>HOW TO PLAY</h2><p>相手の石を自分の石ではさんで裏返そう。縦・横・斜めのどの方向でもOK。置ける場所がない場合は自動でパスになります。</p></section>
<footer>NEON HUNTER <span>◆</span> GAME ROOM</footer>
</main><script src="script.js"></script></body></html>
